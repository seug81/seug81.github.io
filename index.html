<title>Links — коллекция полезных ссылок</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --fg:#111827; --muted:#6b7280;
    --line:#e5e7eb; --accent:#2563eb; --accent-soft:#eef4ff;
    --header:rgba(255,255,255,.86); --radius:14px;
  }
  html[data-theme="dark"]{
    --bg:#0e1116; --card:#161a21; --fg:#e8eaed; --muted:#98a2b3;
    --line:#252b35; --accent:#6aa6ff; --accent-soft:#1a2333;
    --header:rgba(14,17,22,.86);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:1440px;margin:0 auto;padding:0 16px}

  /* ---------- header ---------- */
  .top{
    position:sticky; top:0; z-index:20;
    background:var(--header); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .top-inner{display:flex; align-items:center; gap:14px; padding:12px 16px; max-width:1440px; margin:0 auto}
  .brand{
    display:flex; align-items:center; gap:8px; font-weight:700; font-size:17px;
    text-decoration:none; white-space:nowrap; letter-spacing:.2px;
  }
  .search{flex:1; position:relative}
  .search input{
    width:100%; padding:10px 14px; border-radius:11px;
    border:1px solid var(--line); background:var(--card); color:var(--fg);
    font-size:14px; outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .icon-btn{
    width:40px; height:40px; flex:0 0 40px; border-radius:11px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--fg);
    font-size:17px; line-height:1; transition:background .15s, transform .1s;
  }
  .icon-btn:hover{background:var(--accent-soft)}
  .icon-btn:active{transform:scale(.95)}

  /* ---------- chips ---------- */
  .chips{
    display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px;
    max-width:1440px; margin:0 auto; scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--muted);
    font-size:13px; font-weight:500; white-space:nowrap;
    transition:all .15s;
  }
  .chip:hover{color:var(--fg); border-color:var(--accent)}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff}

  /* ---------- sections ---------- */
  main{padding:24px 16px 60px; max-width:1440px; margin:0 auto}
  .section{margin-bottom:38px; scroll-margin-top:120px}
  .section h2{
    display:flex; align-items:center; gap:10px;
    font-size:19px; font-weight:700; margin:0 0 16px; letter-spacing:.2px;
  }
  .section h2 .ico{font-size:20px}
  .cnt{
    font-size:12px; font-weight:600; color:var(--muted);
    background:var(--card); border:1px solid var(--line);
    padding:2px 8px; border-radius:999px;
  }
  .groups{
    display:grid; gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    align-items:start;
  }
  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 16px 16px;
    transition:border-color .15s, box-shadow .15s;
  }
  .card:hover{border-color:var(--accent); box-shadow:0 6px 22px -14px rgba(0,0,0,.4)}
  .card h3{
    margin:0 0 10px; font-size:13px; font-weight:700;
    text-transform:uppercase; letter-spacing:.7px; color:var(--muted);
  }
  .links{display:flex; flex-wrap:wrap; gap:6px}

  /* ---------- link + icon ---------- */
  .link{
    display:inline-flex; align-items:center; gap:7px;
    text-decoration:none; font-size:13.5px;
    padding:4px 10px 4px 7px; border-radius:9px;
    border:1px solid var(--line); background:transparent;
    transition:all .13s;
  }
  .link .fav{
    width:16px; height:16px; flex:0 0 16px;
    border-radius:4px; object-fit:contain;
    display:block;
  }
  .link:hover{
    background:var(--accent); border-color:var(--accent); color:#fff;
    transform:translateY(-1px);
  }
  mark{background:var(--accent-soft); color:var(--accent); border-radius:4px; padding:0 2px}
  .link:hover mark{background:rgba(255,255,255,.25); color:#fff}

  .empty{text-align:center; color:var(--muted); padding:80px 0; font-size:16px}
  .foot{
    border-top:1px solid var(--line); padding:20px 16px 40px;
    color:var(--muted); font-size:13px; text-align:center;
    max-width:1440px; margin:0 auto;
  }
  .foot b{color:var(--fg)}
  @media (max-width:640px){
    .brand span{display:none}
    .groups{grid-template-columns:1fr}
    .section h2{font-size:17px}
  }
</style>
</head>

</header>

/* ============================================================
   ЛОГИКА
   ============================================================ */
const app     = document.getElementById('app');
const chipsEl = document.getElementById('chips');
const qEl     = document.getElementById('q');
const foundEl = document.getElementById('found');
const root    = document.documentElement;

let activeSection = 'all';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- favicon helpers ---------- */
function domainOf(url){
  try{
    return new URL(url).hostname.replace(/^www\./,'');
  }catch(e){ return ''; }
}
function isPrivateHost(host){
  return /^\d+\.\d+\.\d+\.\d+$/.test(host) ||
         host === 'localhost' ||
         host.endsWith('.local');
}
function iconFor(url){
  const host = domainOf(url);
  if(!host || isPrivateHost(host)) return '';
  return 'https://icons.duckduckgo.com/ip3/' + host + '.ico';
}

function hl(text, q){
  if(!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if(i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

function render(){
  const q = qEl.value.trim().toLowerCase();
  let html = '', total = 0;

  DATA.forEach(sec => {
    if(activeSection !== 'all' && activeSection !== sec.id) return;

    let secHtml = '', count = 0;

    sec.groups.forEach(g => {
      const links = g.links.filter(([name, url]) =>
        !q ||
        name.toLowerCase().includes(q) ||
        url.toLowerCase().includes(q) ||
        g.title.toLowerCase().includes(q)
      );
      if(!links.length) return;

      count += links.length;
      secHtml += '<article class="card">' +
        '<h3>' + hl(g.title, q) + '</h3>' +
        '<div class="links">' +
          links.map(([n, u]) => {
            const icon = iconFor(u);
            const img  = icon
              ? '<img class="fav" src="' + esc(icon) + '" alt="" loading="lazy" ' +
                'onerror="this.style.display=\'none\'">'
              : '';
            /* ссылка открывается в том же окне — без target и rel */
            return '<a class="link" href="' + esc(u) + '">' +
                     img + hl(n, q) +
                   '</a>';
          }).join('') +
        '</div></article>';
    });

    if(!count) return;
    total += count;

    html += '<section class="section" id="sec-' + sec.id + '">' +
      '<h2><span class="ico">' + sec.icon + '</span>' + sec.title +
      '<span class="cnt">' + count + '</span></h2>' +
      '<div class="groups">' + secHtml + '</div></section>';
  });

  app.innerHTML = html || '<p class="empty">Ничего не найдено 🤷</p>';
  foundEl.textContent = total;
}

/* ---- чипы-разделы ---- */
chipsEl.innerHTML =
  '<button class="chip active" data-sec="all">Все</button>' +
  DATA.map(s => '<button class="chip" data-sec="' + s.id + '">' + s.icon + ' ' + s.title + '</button>').join('');

chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if(!btn) return;
  chipsEl.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === btn));
  activeSection = btn.dataset.sec;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* ---- поиск ---- */
let t;
qEl.addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 80); });

/* ---- тема ---- */
function setTheme(theme){
  root.dataset.theme = theme;
  localStorage.setItem('theme', theme);
  document.getElementById('theme').textContent = theme === 'dark' ? '☀️' : '🌙';
}
document.getElementById('theme').addEventListener('click', () => {
  setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
});
setTheme(
  localStorage.getItem('theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
);

/* ---- горячая клавиша "/" ---- */
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== qEl){
    e.preventDefault();
    qEl.focus();
    qEl.select();
  }
  if(e.key === 'Escape' && document.activeElement === qEl){
    qEl.value = '';
    qEl.blur();
    render();
  }
});

/* ---- старт ---- */
render();
</script>
